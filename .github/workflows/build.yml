name: Build

# Every push / pull request: type check, test and package the extension (.vsix as build artifact).
# Pushing a new version in package.json to a branch creates the tag `v<version>` on the commit
# that introduced it: development versions (`0.5.0-devel.1`) after every change, release
# versions (`0.5.0`) only after `npm run bump -- release`, which the user decides on.
# Tags must match package.json; development tags only build, a release tag also publishes a
# GitHub release with the .vsix (the tag can be pushed by hand as well).
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Package
        id: package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          FILE="yaml-scheme-validator-${VERSION}.vsix"
          npx --yes @vscode/vsce@3 package --skip-license --out "$FILE"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Check tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      - name: Tag version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        env:
          # The workflow token may not create tags on commits that change workflow files;
          # a repository secret TAG_TOKEN (fine-grained token with Contents and Workflows:
          # read and write) can.
          GH_TOKEN: ${{ secrets.TAG_TOKEN || github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG exists already"
            exit 0
          fi
          # the commit that set this version (later repository-only commits keep it)
          COMMIT=$(git log --format=%H --reverse -S"\"version\": \"$VERSION\"" -- package.json | head -n 1)
          COMMIT=${COMMIT:-$GITHUB_SHA}
          if gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$COMMIT" >/dev/null; then
            echo "Tagged $COMMIT as $TAG"
          else
            echo "::warning::Could not create $TAG on $COMMIT (see the log above). Add a TAG_TOKEN secret or create it by hand: git tag $TAG $COMMIT && git push origin $TAG"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.file }}
          path: ${{ steps.package.outputs.file }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          FILE: ${{ steps.package.outputs.file }}
        run: |
          # release notes: the CHANGELOG.md section of this version
          awk -v v="## $VERSION" '$0 == v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" "$FILE" --title "$GITHUB_REF_NAME" --notes-file notes.md --target "$GITHUB_SHA"
