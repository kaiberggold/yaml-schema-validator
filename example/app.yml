# yaml-language-server: $schema=app.schema.yml
# Validated by app.schema.yml (the first line also lets the Red Hat YAML extension use it).
extends: base.yml

name: Demo_App
version: 1.2
mode: staging
server:
  host: &host localhost   # unused anchor: shown greyed out
  port: 70000
  tls: yes
database:
  extends: database/db.yml
features:
  - name: search
    enabled: &on true      # hover '&on' or '*on' to see the anchored value
  - name: export
    enbled: false
  - name: audit
    enabled: *on
debug: true
