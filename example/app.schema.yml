# Scheme for app.yml: a JSON Schema (2020-12) written in YAML.
$schema: "https://json-schema.org/draft/2020-12/schema"
description: Application configuration.
type: object
required: [name, version, server]
additionalProperties: false
properties:
  extends:
    description: Files merged into this one (handled by YAML Scheme Validator; declared so other JSON Schema tools accept the key).
    type: [string, array]
    items:
      type: string
  name:
    type: string
    pattern: "^[a-z][a-z0-9-]*$"
    description: Technical name of the application (lowercase, digits and dashes).
    # shown by this extension and by Red Hat YAML (which does not fill in placeholders)
    patternErrorMessage: "The application name must be lowercase kebab-case (letters, digits and dashes)"
    # placeholders are filled in by this extension; other tools ignore x-errorMessages
    x-errorMessages:
      pattern: "Application name '${value}' must be lowercase kebab-case (rule: ${scheme}:${ruleLine})"
  version:
    type: string
    pattern: "^\\d+\\.\\d+\\.\\d+$"
    description: Semantic version, e.g. `1.2.3`. Quote it so YAML keeps it a string.
    examples: ["1.0.0"]
  mode:
    enum: [development, production, test]
    default: development
    description: Runtime mode.
  logLevel:
    enum: [debug, info, warn, error]
    default: info
    description: Minimal level of log messages.
  timeout:
    type: integer
    minimum: 1
    description: Request timeout in seconds.
  server:
    $ref: "#/$defs/server"
  database:
    type: object
    description: Database settings, usually included from `database/db.yml` (validated by its own scheme).
  features:
    type: array
    description: Optional features.
    items:
      $ref: "#/$defs/feature"
  debug:
    type: boolean
    deprecationMessage: "use 'logLevel: debug' instead"
    description: Old switch for debug output.

$defs:
  server:
    type: object
    description: HTTP server settings.
    additionalProperties: false
    properties:
      host:
        type: string
        default: localhost
        description: Interface to bind to.
      port:
        type: integer
        minimum: 1
        maximum: 65535
        default: 8080
        description: TCP port.
        x-severity: error
        x-errorMessages:
          minimum: "Port ${value} is out of range [${minimum}, ${maximum}] — see the server docs."
          maximum: "Port ${value} is out of range [${minimum}, ${maximum}] — see the server docs."
        x-see:
          - README.md:1
          - file: database/db.yml
            label: Database port is configured separately
      tls:
        type: boolean
        default: false
        description: Enable HTTPS.
  feature:
    type: object
    required: [name]
    additionalProperties: false
    properties:
      name:
        type: string
        description: Feature identifier.
      enabled:
        type: boolean
        default: true
        description: Whether the feature is active.
